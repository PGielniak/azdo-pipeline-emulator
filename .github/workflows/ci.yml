# E00-S01-T02 — lint + typecheck + unit (ubuntu, macos) + bats for packages/runtime.
# Node matrix per C-E00-002: 22 = maintenance LTS floor (engines >=22), 24 = active LTS.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # pnpm version from root package.json "packageManager"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - name: Unit tests (vitest, junit report)
        run: |
          mkdir -p reports
          pnpm vitest run --reporter=default --reporter=junit --outputFile.junit=reports/vitest-junit.xml
      - name: Runtime tests (bats, junit report) # C-E00-003/004: dir invocation + --report-formatter
        run: |
          mkdir -p reports
          pnpm --filter @azdo-emu/runtime exec bats test --report-formatter junit --output "$GITHUB_WORKSPACE/reports"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}-node${{ matrix.node }}
          path: reports/
