parameters:
- name: a
  type: boolean
  default: false
- name: b
  type: boolean
  default: true
stages:
- stage: probe
  jobs:
  - job: probe
    steps:
      - ${{ if parameters.a }}:
        - task: CmdLine@2
          inputs:
            script: echo from-if
      - ${{ else }}:
        - task: CmdLine@2
          inputs:
            script: echo from-else
      - ${{ elseif parameters.b }}:
        - task: CmdLine@2
          inputs:
            script: echo from-elseif
