parameters:
- name: a
  type: boolean
  default: true
- name: b
  type: boolean
  default: false
stages:
- stage: probe
  jobs:
  - job: probe
    steps:
      - ${{ if parameters.a }}:
        - task: CmdLine@2
          inputs:
            script: echo first-if
      - ${{ else }}:
        - task: CmdLine@2
          inputs:
            script: echo first-else
      - ${{ if parameters.b }}:
        - task: CmdLine@2
          inputs:
            script: echo second-if
      - ${{ else }}:
        - task: CmdLine@2
          inputs:
            script: echo second-else
