parameters:
- name: fruits
  type: object
  default:
  - name: apple
    colors:
    - red
    - green
  - name: lemon
    colors:
    - yellow
stages:
- stage: probe
  jobs:
  - job: probe
    steps:
    - task: CmdLine@2
      inputs:
        script: echo apple-red
    - task: CmdLine@2
      inputs:
        script: echo apple-green
    - task: CmdLine@2
      inputs:
        script: echo lemon-yellow

