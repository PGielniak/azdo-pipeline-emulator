name: $(Date:yyyyMMdd)$(Rev:.r)
trigger:
  branches:
    include:
    - main
variables:
- name: buildConfiguration
  value: Release
- group: shared-secrets
stages:
- stage: Build
  displayName: Build stage
  jobs:
  - job: Compile
    pool:
      vmImage: ubuntu-latest
    steps:
    - checkout: self
      fetchDepth: 1
    - bash: make
      displayName: Build
      env:
        CONFIG: $(buildConfiguration)
    - task: CopyFiles@2
      inputs:
        SourceFolder: $(Build.SourcesDirectory)
        Contents: '**/*.tar.gz'
        TargetFolder: $(Build.ArtifactStagingDirectory)
    - publish: $(Build.ArtifactStagingDirectory)
      artifact: drop
- stage: Deploy
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployWeb
    environment: production
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop
          - script: ./deploy.sh
