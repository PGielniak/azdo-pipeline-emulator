# L5 sample 3 — the half a green pipeline cannot check: a step fails, and the run's *shape* is the
# assertion. Condition evaluation, continueOnError, and the exit code the runner reports.
#
# This is where a controlled image pays for itself. `drift.ts` Phase B records exit codes rather
# than pinning them (decision 75), because on a hosted GitHub runner the toolset decides them. Here
# the toolset is the image, so the code is a fact about the runtime and can be asserted (C-E12-029).
#
# The two `condition: failed()` steps below were **removed** on this sample's first run, because the
# first of them ran when `SucceededWithIssues` should have made `failed()` False (C-E06-040). That
# was C-E12-036, filed as an open finding rather than guessed at. E11-S04-T03 found the cause and it
# was not in the condition machinery at all: `${no_condition:+--no-condition}` tests for a
# *non-empty* value and the variable's default was the string `false`, so every generated `run_step`
# was passed `--no-condition` and no step condition in any generated project was ever evaluated
# (C-E12-038). Both directions are pinned here now — False after a tolerated failure, True after a
# real one — because a fix that only ever makes conditions False would pass a one-sided assertion.
trigger: none
pr: none

pool:
  vmImage: ubuntu-latest

steps:
- checkout: none
- script: echo "E2E-MARKER first step ran"
  displayName: Succeed
- script: |
    echo "E2E-MARKER tolerated failure"
    exit 1
  displayName: Fail but continue
  continueOnError: true
- script: echo "E2E-MARKER reached after continueOnError"
  displayName: Runs because the failure was tolerated
- script: echo "E2E-MARKER must not run while the only failure was tolerated"
  displayName: Skipped because a tolerated failure is not a failed job
  condition: failed()
- script: |
    echo "E2E-MARKER final step ran"
    exit 4
  displayName: Fail for real
- script: echo "E2E-MARKER must not run after a real failure"
  displayName: Never reached
- script: echo "E2E-MARKER failed() is true after a real failure"
  displayName: Runs because the job really did fail
  condition: failed()
