parameters:
- name: a
  type: boolean
  default: false
- name: extra
  type: object
  default:
    MID: mid
variables:
  ${{ if parameters.a }}:
    PICK: from-if
  ${{ else }}:
    PICK: from-else
  ${{ insert }}: ${{ parameters.extra }}
stages:
- stage: probe
  jobs:
  - job: probe
    steps:
      - task: CmdLine@2
        inputs:
          script: echo probe
