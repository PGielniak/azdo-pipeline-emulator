parameters:
- name: a
  type: boolean
  default: false
- name: b
  type: boolean
  default: false
stages:
- stage: probe
  jobs:
  - job: probe
    steps:
      - ${{ if parameters.a }}:
        - task: CmdLine@2
          inputs:
            script: echo from-if
      - task: CmdLine@2
        inputs:
          script: echo interrupt
      - ${{ else }}:
        - task: CmdLine@2
          inputs:
            script: echo from-else
