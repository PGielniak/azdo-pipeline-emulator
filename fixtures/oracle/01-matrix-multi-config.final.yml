trigger:
  enabled: false
pr:
  enabled: false
pool:
  vmImage: ubuntu-latest
stages:
- stage: __default
  jobs:
  - job: build
    displayName: Build
    strategy:
      matrix:
        linux_debug:
          imageName: ubuntu-latest
          buildConfiguration: Debug
        linux_release:
          imageName: ubuntu-latest
          buildConfiguration: Release
        windows_release:
          imageName: windows-latest
          buildConfiguration: Release
      maxParallel: 2
    pool:
      vmImage: $(imageName)
    variables:
    - name: artifactSuffix
      value: $(Agent.JobName)
    steps:
    - task: CmdLine@2
      displayName: Report matrix leg
      inputs:
        script: echo "config=$(buildConfiguration) image=$(imageName)"
    - task: CmdLine@2
      displayName: Produce output
      inputs:
        script: |
          mkdir -p out
          echo "$(buildConfiguration)" > out/config.txt
    - task: CmdLine@2
      displayName: Job-scoped variable over a matrix variable
      inputs:
        script: echo "suffix=$(artifactSuffix)"
  - job: fanin
    displayName: Fan-in over every matrix leg
    dependsOn:
    - build
    condition: succeeded()
    steps:
    - task: CmdLine@2
      inputs:
        script: echo "all legs finished"
  - job: parallel_slices
    displayName: Parallel (slice) strategy
    strategy:
      parallel: 3
    steps:
    - task: CmdLine@2
      inputs:
        script: echo "slice $(System.JobPositionInPhase) of $(System.TotalJobsInPhase)"

